<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Shortcuts</title>
  <style>
    /* Dark theme reset and layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #f0f6fc;
    }

    p {
      font-size: 0.9rem;
      color: #8b949e;
      margin-bottom: 24px;
    }

    /* Links container */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Cyan-themed shortcut button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      background-color: transparent;
      color: #00f0ff;
      border: 1px solid #00f0ff;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #00f0ff;
      color: #0d1117;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      margin-right: 8px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Shared Files</h1>
    <p>Quick access links</p>

    <div class="links-list">
      <!-- REPLACE 'YOUR_GOOGLE_DRIVE_LINK_HERE' WITH YOUR ACTUAL DRIVE LINK -->
      <a href="YOUR_GOOGLE_DRIVE_LINK_HERE" target="_blank" rel="noopener noreferrer" class="btn">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        Open Google Drive Folder
      </a>
    </div>
  </div>

</body>
</html>
